<script>
  // ===== 篇目数据：original 原文 / translation 译文 / analysis 简析；留空则显示待录入 =====
  const list = [
    { title: "金匮要略注",original: "『伤寒论』论伤寒，『金匮要略』论杂病，乃仲景全书。『伤寒论』得成无已创注，续者五十余家，故得昌明宇内；『金匮要略』人罕言之，虽有赵良、徐彬等注释，但其文义古奥，系千载残编错简，颇多疑义，阙文亦复不少，承□袭谬，随文蔓衍，宜后人视为迂远，束诸高阁。今于其失次者序之，残缺者补之，博采群书，详加注释，俾二书并行于世，庶后之业医者，不为俗说所误，知仲景能治伤寒，未尝不能治杂证也", translation: "",analysis: "" },
    { title: "藏府经络先后病脉证第一",original: "</p>夫人秉五常，因风气而生长，风气虽能生万物，亦能害万物，如水能浮舟，亦能覆舟。若五藏元真通畅，人即安和，客气邪风，中人多死，千般?M难，不越三条。一者，经络受邪入藏府，为内所因也；二者，四肢九窍，血脉相传，壅塞不通，为外皮肤所中也；三者，房室金刃，虫兽所伤。以此详之，病由都尽。若人能养慎，不令邪风干忤经络，适中经络，未流传府藏，即医治之，四肢才觉重滞，即导引吐纳，针灸膏摩，勿令九窍闭塞。更能无犯王法，禽兽灾伤，房室勿令竭乏，服食节其冷热，苦酸辛甘，不遣形体有衰，病则无由入其腠理。腠者，三焦通会元真之处，为血气所注。理者，是皮肤藏府之文理也。<p></p>【按】此篇乃一书之纲领，前人误编为次篇，先后失序，今冠于首，以统大意。<p></p>【注】五常者，五行也。五行之气－－风、暑、湿、燥、寒、也；五行之味－－酸、苦、甘、辛、咸也。夫人禀此而有其形，则藏府日与气味相通，不曰五气，而曰风气者，该他气而言也。盖风贯四气，犹仁贯四德，故曰：因风气而生长也。然风气虽能生万物，亦能害万物者，盖主气正风，从其所居之乡而来，主长养万物者也，客气邪风，从其冲后而来，主杀害万物者也。人在气交之中，其生其害，犹水能浮舟亦能覆舟也。天之五气，人得之则为五藏真元之气，若通畅相生，虽有客气邪风，勿之能害，人自安和；如不通畅，则客气邪风，乘隙而入，中人多死。然人致死之由，虽有千般?M难，大要不外三因：一者中虚，经络受邪，即入藏府，此为内所因也；二者中实，虽感于邪，藏府不受，惟外病躯体，四肢九窍，血脉壅塞，此为外所中也；三者房室金刃，虫兽所伤，非由中外虚实，感召其邪，是为不内外因也。以此三者详之，千般?M难，病由悉尽矣。若人能慎养形气，不令客气邪风干忤经络，即适中经络，未传藏府，送医治之，自可愈也。四肢九窍，才觉重滞，尚未闭塞，即导引、吐纳、针灸、按摩，亦可愈也。更能无犯王法，禽兽灾伤，房室勿令竭乏，服食节其冷热，五味各得其宜，不使形气有衰，万病?M难无由而入其腠理矣。腠者，一身空隙，血气往来之处，三焦通会真元之道路也。理者，皮肤藏府，内外井然，不乱之条理也。<p></p>【按】正风者，从八方应时而来，相生和缓之主气也；邪风者，从其冲后而来，相□冲烈之客气也。如时当东风而来西风也，所谓后者以已过之时言也。<p></p>【集注】<p>赵良曰：人在气交中，秉地之刚柔，以成五藏百骸之形，秉天之陰陽，以成六经之气，形气合一，神机发用，驾行谷气，出入内外，同乎天度，升降浮沉，应夫四时，主宰于身形之中，谓之元真。外感者，客气也。『灵枢』曰：虚邪不能独伤，必因身形之虚而后客之。盖天人之气，各有正、不正，人气正则不受邪，不正则邪乘之；天气正则助其生长，不正则害之。人气不正者，由七情动中，服食不节，房欲过度，金刃虫兽，伤其气血，尽足以受病也。天气不正者，由四时不和，八风不常，尽足以伤万物也。<p></p>问曰：上工治未病，何也？师曰：夫治未病者，见肝之病，知肝传脾，当先实脾，四季脾王不受邪，即勿补之。中工不晓相传，见肝之病，不解实脾，惟治肝也。夫肝之病，补用酸，助用焦苦，益用甘味之药调之。酸入肝，焦苦人心，甘入脾，脾能伤肾，肾气微弱，则水不行，水不行，则心火气盛，则伤肺，肺被伤，则金气不行，金气不行，则肝气盛，肝气盛，则肝自愈，此治肝补脾之要妙也。肝虚则用此法，实则不再用之。经曰：虚虚实实，补不足，损有余。是其义也。余藏准此。<p></p>【注】<p></p>此承上条受病三因，以明其治。上工，良医也。中工，常医也。已病，已然之病也。未病，未然之病也。假如现在肝病，此已然之病也；肝病将来传脾，此未然之病也。</p>良医知肝病传脾，见人病肝，先审天时衰旺，次审脾土虚实，时旺脾实则知不受肝邪，不须补脾，直治已病之肝，若时衰脾虚，则知肝必传脾，先补未病之脾，兼治已病之肝。彼常医不晓四时所胜，五藏相传之理，见肝之病，惟泻已病之肝，不知补未病之脾也。上工不但知肝实必传，脾虚之病，而且知肝虚不传，脾虚反受肺邪之病，故治肝虚，脾虚之病，则用酸入肝，以补已病之肝，用焦苦入心，以助不病之心，用甘入脾，以益不实之脾。使火生土，使土制水，水弱则火旺，火旺则制金，金被制则木不受邪，而肝病自愈矣，此亢则害，承乃制，制则生化，化生不病之理，隔二、隔三之治，故曰：此治肝补脾之要妙也。然肝虚则用此法，若肝实则不用此法也。中工不晓虚实，虚者泻之，是为虚虚；实者补之，是为实实，非其义也。上工知其虚实，补其不足，损其有余，是其义也。其余四藏，皆准此法。伤字，作制字看。<p></p>【集注】徐彬曰：假如肝经之病，肝木胜脾土，知邪必传脾经，治宜实脾为先，此脾未病而先实之，所谓治未病也。不忧本藏之虚，而忧相传不已，其病益深，故先以实脾为急务也。<p></p>程林曰：经云：因其轻而扬之，因其重而减之，因其衰而彰之。所谓因者，乘其机也。治未病者，谓治未病之藏府，非治未病之人也。见肝之病，当先实脾，使土旺则能胜水，水不行则火盛而制金，金不能干木，肝自愈矣。此治肝补脾，治未病之法也。高世蛟唬菏灯制水，使火盛金衰，肝不受制，则肝自愈，其理甚精微，故曰：此治肝补脾之要妙也。<p></p>问曰：病人有气色见于面部，愿闻其说？师曰：鼻头色青，腹中痛，苦冷者死（一云：腹中冷，苦痛者死。）；鼻头色微黑者，有水气；色黄者，胸上有寒；色白者，亡血也；设微赤非时者，死。其目正圆者，痉，不治。又色青为痛，色黑为劳，色赤为风，色黄者便难，色鲜明者有留饮。<p></p>【注】气色见于面部，而知病之死生者，以五气入鼻，藏以五藏，其精外荣于面也。色者，青、赤、黄、白、黑也。气者，五色之光华也。气色相得者，有气有色，平人之色也，即经云：青如翠羽，赤如鸡冠，黄如蟹黄，白如豚膏，黑如乌羽者，生也。气色相失者，色或浅深，气或显晦，病人之色也。即经云：浮泽为外，沉浊为内，察其浮沉，以知浅深，察其夭泽，以观成败，察其散抟，以知新故，视色上下，以知病处，色粗以明，沉夭为甚，不明不泽其病不甚也。有色无气者，色枯不泽，死人之色也。即经云：青如蓝叶，黄如黄土，赤如?[血，白如枯骨，黑如炱者，死也。鼻者，明堂也，明堂光泽，则无病矣。而曰见青色为腹中痛，鼻苦冷甚者死；黑色为水为劳，黄色为上寒下热，小便难，面目鲜明，内有留饮；色白为亡血，色赤为热为风，若见于冬，为非其时者死。目直视，正圆不合，如鱼眼者，痉，不治。此气色主病之大略，其详皆载『内经』。<p</p>>师曰：病人语声寂然，喜惊呼者，骨节间病；语声喑喑然，不彻者，心膈间病；语声啾啾然，细而长者，头中病（一作痛）。<p></p>【按】头中病之「头」字，当是「腹」字。经中从无头中病之文，且文义不属，必是传写之。<p></p>【注】病人语声寂然，谓寂然不语也，若恶人语是心病也。喜惊呼者，谓不恶人语，且喜惊呼，是知其病不在心而在外也，故曰：骨节间病也。病人语声喑喑然不彻者，谓声不响亮而不了彻也，此有碍于息气，故知为心膈间病也。病人语声啾啾然细而长者，谓唧唧哝哝小而悠长也，因不敢使气急促动中，故知腹中病也。<p></p>师曰：息摇肩者，心中坚；息引胸中上气者，咳；息张口短气者，肺痿唾沫。<p></p>【注】息者，一呼一吸也。摇肩，谓抬肩也。心中坚，谓胸中壅满也。呼吸之息，动形抬肩，胸中壅气上逆者，喘病也。呼吸引胸中之气上逆，喉中作痒梗气者，咳病也。呼吸张口，不能续息，似喘而不抬肩者，短气病也。盖肺气壅满，邪有余之喘也，肺气不续息，正不足之短气也。然不足之喘，亦有不续息者，有余之短气，亦有胸中壅满者，肺气上逆者，必咳也。咳时唾痰，嗽也，若咳唾涎沫不已者，非咳病也，乃肺痿也。<p></p>师曰：吸而微数，其病在中焦，实也。当下之即愈。虚者不治。在上焦者，其吸促；在下焦者，其吸远，此皆难治。呼吸动摇振振者，不治。<p></p>【按】吸促之「促」字，当是「远」字；吸远之「远」字，当是「促」字，方合病义，必传写之。<p></p>【注】此承上文，言喘分三焦，有可治、不可治之辨也。喘，肺病也，肺主气，司呼吸，故以呼吸气促，谓之?K也。若呼吸气均促，是病在呼吸，阻升降之气也，故知喘在中焦也；呼之气促，吸之气长，病在呼，呼出心与肺，故知喘在上焦也；呼之气长，吸之气短，病在吸，吸入肾与肝，故知喘在下焦也。喘之实者，谓邪气盛，则实也，中实，则必腹满便□，当下之，可治也。喘之虚者，谓正气夺则虚也，中虚，则必腹软便滋，不堪下，难治也。若喘而呼吸动摇，振振不能擎身者，则为形气不相保，勿论虚实不治也。曰吸而微数，数即促也，促即短也，远即长也。吸不言呼，略辞也，犹言呼吸均短，呼短吸长，吸短呼长也。<p></p>师曰：寸口脉动者，因其王时而动，假令肝王色青，四时各随其色，肝色青而反色白，非其时色脉，皆当病。<p></p>【注】寸口者，统言左右三部脉也。脉动法乎四时，命乎五藏，然必因其王时而动，则为平脉也。假令肝旺于春，随其时，色当青，脉当弦，此不病之色脉也。若色反白，脉反浮，此非其时，乃病之色脉也。四时准此。<p></p>【集注】尤怡曰：王时，当时至而气王，乃脉乘之而动，其色亦应之。如肝王于春，脉弦而色青，此其常也，推之四时，无不皆然。若色当青而反白，为非其时，而有是色，不特肝病为然，即肺亦当病矣。<p></p>问曰：有未至而至，有至而不至，有至而不去，有至而太过，何谓也？师曰：冬至之后，甲子夜半，少陽起，少陽之时，陽始生，天得温和。以未得甲子，天因温和，此为未至而至也；以得甲子，而天未温和，此为至而不至也；以得甲子，而天大寒不解，此为至而不去也；以得甲子，而天温如盛夏五六月时，此为至而太过也。<p></p>【注】冬至之后，得甲子日夜半，少陽之气始生，天渐温和，气之常也。若未得甲子，天即温和，此为未至而至也。气未应至而先至者，是来气有余也。已得甲子，陽气渐盛，天未温和，此为至而不至也。气应至而不至者，是来气不足也。若天大寒不解，此为至而不去也。气应去而不去者，是去气太过也。若天过温如盛夏时，此为至而太过也。气应至而甚者，是至气太过也。太过者，其气婬，则薄其所不胜，乘其所胜也。不及者，其气迫，则所胜妄行，；所生者受病，所不胜薄之也。此『内经』所谓谨候其时，气可与期，余皆仿此。<p></p>师曰：病人脉浮者在前，其病在表；浮者在后，其病在里，腰痛背强不能行，必短气而极也。<p></p>【注】脉浮虚风之候也，关前之寸脉浮者，病在表也；关后之尺脉浮者，病在里也。虚风在表，故主腰痛背强不能行也。虚风在里，故主短气而极也。<p></p>问曰：经云：厥陽独行，何谓也？师曰：此为有陽无陰，故称厥陽。<p></p>【注】陰陽偕行，顺也；陰陽独行，逆也。厥，逆也，逆陽独行，此为有陽无陰，故称厥陽也。<p></p>【集注】李曰：厥陽即陽厥也。『内经』云：陽气衰于下则为寒厥，陰气衰于下则为热厥，此厥陽独行，有陽无陰之大概也。高世?蛟唬喊创宋?有陽无陰，是为厥陽也。经曰：陰气衰于下，则为热厥。帝曰：热厥何如而然也？岐伯曰：陰气虚，则陽气入，陽气入，则胃不和，胃不和，则精气竭，精气竭则不荣于四肢也，乃肾气日衰，陽气独胜，此所以为有陽无陰，而为厥陽独行也。<p></p>□问曰：寸脉沉大而滑，沉则为实，滑则为气，实气相抟，血气入藏即死，入府即愈，此为卒厥何谓也？师曰：唇口青，身冷，为入藏，即死；如身和，汗自出，为入腑，即愈。<p></p>【按】「寸脉沉大而滑，沉则为实，滑则为气实，实气相抟」之十八字，文理不顺，衍文也。血气入藏之「血」字，当是「厥」字，始与卒厥相合，必传写之□也。<p></p>【注】此详申陽厥、陰厥生死之义也。厥气者，逆气也，即逆陽逆陰之气也，气逆则乱于胸中，故忽然眩仆，名曰卒厥。若唇口青，身冷，是陰进陽退，则为入藏，即死也；若身温汗自出，是陰消陽长，则为入府，即愈也。<p></p>【集注】沈明宗曰：邪气入藏，神明昏愦，卒倒无知，谓之卒厥。若唇口青，身冷，神机不能出入，藏气垂绝，所以主死。经曰：血气并走于上，则为大厥、暴厥是也。若身和汗出，乃邪气入府，不得出入，一时卒倒，非藏绝之比，顷时陽机外达，邪气随之外泄，故知入府即愈。<p></p>问曰：脉脱入藏即死，入府即愈，何谓也？师曰：非为一病，百病皆然。譬如浸婬疮，从口起流向四肢者，可治；从四肢流来入口者，不可治。病在外者可治，入里者即死。<p></p>【注】此详申入藏即死、入府即愈之义也。卒厥之病，多脉脱而不见，脉脱不见而死者，是正气不反也；脉脱不见而生者，是邪气闭而复通也。非为厥气一病，百病入藏入府皆然也。譬如浸婬疠风等疮，从口起流向四肢，可治；从四肢流来入口者，不可治也。盖以病向外者，可治；病入里者，难医，亦此义也。<p></p>【集注】赵良曰：脱者去也，经脉乃藏府之隧道，为邪气所逼，故绝气脱去其脉而入于内。五藏陰也，六府陽也，陰主死而陽主生，所以入藏即死，入府即愈，而可治。非惟藏府之陰陽然也，凡内外陰陽之邪毒出入表里者，皆然也。<p></p徐彬曰：凡病邪能出陽为浅，故生；闭陰不出为深，故死，非止一病，百病皆然。复以浸婬疮喻之，若从口起而流向四肢者，是邪从内发于外，泄而不进，故可治；若从四肢起，流入口者，是邪由外入于内，进而不泄，此藏气伤败，故不可治。<p></p>问曰；陽病十八，何谓也？师曰：头痛，项、腰、脊、臂、脚掣痛。陰病十八，何谓也？师曰：??，上气、喘、哕、咽、肠鸣、胀满、心痛、拘急。五藏病各有十八，合为九十病；人又有六微，微有十八病，合为一百八病。五劳，七伤，六极，妇人三十六病，不在其中。清邪居上，浊邪居下，大邪中表，小邪中里，之邪，从口入者，宿食也。五邪中人，各有法度，风中于前，寒中于暮，湿伤于下，雾伤于上，风令脉浮，寒令脉急，雾伤皮腠，湿流关节，食伤脾胃，极寒伤经，极热伤络。<p></p>【注】此章曰十八、曰九十等文，乃古医书之文，今不可考，难以强释。五劳七伤等说，亦详在『千金』，故不复注也。头痛、项、腰、脊、臂、脚掣痛，病皆在外，故为陽病也、上气、喘、哕、咽、肠鸣、胀满、心痛、拘急病皆在内，故为陰病也。清邪居上，谓雾邪本乎天也；浊邪居下，谓湿邪本乎地也。六婬天邪，故名大邪，六婬伤外，故曰：中表也；七情人邪，故名小邪，七情伤内，故曰：中里也。□?者，饮食也，饮食之邪，从口而入，食伤隔夜不化，故名曰：宿食也。五邪，谓风、寒、湿、雾、饮食也，夫五邪之中人，莫不各以类而相从。前者早也，风中于早，从陽类也；寒中于暮，从陰类也。雾邪清轻，故伤皮肤；湿邪浊重，故流关节。饮食失节，故伤脾胃。极寒之食伤经，以经属陰也；极热之食伤络，以络属陽也。<p></p>问曰：病有急当救里救表者，何谓也？师曰：病，医下之，续得下利，清谷不止，身体疼痛者，急当救里；后身体疼痛，清便自调者，急当救表也。<p></p>【注】详见『伤寒论。太陰篇』内，不复释。夫病痼疾，加以卒病，当先治其卒病，后乃治其痼疾也。<p></p>【注】痼疾，旧病也。卒病，新疾也。当以旧病为本、为缓，新疾为标、为急，急则治标，缓则治本，故先治卒病，后治痼疾也。<p></p>【集注】赵良曰：痼疾病已沈痼，非旦夕可取效者，卒病谓卒然而来，新感之病，可取效于旦夕者，乘其所入未深，急去其邪，不使稽留而为患也。且痼疾之人，正气素虚，邪尤易传，设多瞻顾，致令两邪相合，为患不浅，故仲景立言于此，使后学者，知所先后也。<p></p>沈明宗曰：此有旧疾，复感新邪，当分先后治也。痼者，邪气坚固难拔；卒者，邪气骤来而易去也。若病者素有痼疾，而忽加卒病，务当先治卒病，不使邪气相并，转增旧疾。但久病乃非朝夕可除，须当缓图，所以后乃治其痼疾也。<p></p>师曰：五藏病各有得者愈，五藏病各有所恶，各随其所不喜者为病。病者素不应食，而反暴思之，必发热也。<p></p>【注】此明五藏各有所得而愈，言以情志相胜也，即如怒伤肝，得悲而愈，此悲胜怒也。亦有得之时日而愈者，经曰：病在肝，愈于夏，是喜得子气，制其胜我者也；夏不愈，胜于秋，是恶其胜我者，得王气也；秋不死，持于冬，是我喜得母气以生我也；起于春，是喜自得其位而气王也，余藏仿此。病者云云，谓平素不爱食之物，及当病之时，而反暴思食，是病邪藏气之变，故虽思食，而食之必发热也。<p></p>【集注】程林曰：『内经』云：肝色青，宜食甘；心色赤，宜食酸；肺色白，宜食苦；脾色黄，宜食酸；肾色黑，宜食辛，此五藏得饮食而愈者。肝病愈于丙丁，起于甲乙；心病愈于戊己，起于丙丁；脾病愈于庚辛，起于戊己；肺病愈于壬癸，起于庚辛；肾病愈于甲乙，起于壬癸，此五藏自得其位而愈者。五藏所恶，心恶热，肺恶寒，肝恶风，脾恶湿，肾恶燥，各随其所恶而不喜者为病也。若病人素不食而暴食之，则入于陰，长气于陽，必发热也。<p></p>夫诸病在藏，欲攻之，当随其所得而攻之，如渴者，与猪苓汤，余皆仿此。<p></p>【按】如渴者之下，当有「小便不利」四字，必传写之遗也。<p></p>【注】藏者里也。凡诸病在里有可攻之证，虽欲攻之，当随其所得之轻重而攻之，不可率意而攻之也。如渴者小便不利，先与猪苓汤利其小便，俟小便利乃可攻也。余皆仿此，谓他证或有未可遽攻者，皆仿此也。", translation: "", analysis: "", },

    btnSun.textContent = darkMode ? '☀' : '🌙';
    btnSun.title = darkMode ? '切换到日间模式' : '切换到古籍模式';
  }

  function renderContent(index) {
    currentIndex = index;
    const item = list[index];
    contentTitle.textContent = item.title;
    pageInfo.textContent = '第 ' + (index + 1) + ' 篇 / 共 ' + list.length + ' 篇';

    // 组装正文：原文 / 译文 / 简析；任一字段为空就跳过，全空显示待录入
    let html = '';
    if (item.original && item.original.trim()) {
      html += '<p><span class="label">【原文】</span>' + item.original + '</p>';
    }
    if (item.translation && item.translation.trim()) {
      html += '<p><span class="label">【译文】</span>' + item.translation + '</p>';
    }
    if (item.analysis && item.analysis.trim()) {
      html += '<p><span class="label">【简析】</span>' + item.analysis + '</p>';
    }
    if (!html) {
      html = '<p style="text-align:center;color:#8a7258;">待录入原文</p>';
    }
    contentBody.innerHTML = html;
    contentBody.style.fontSize = fontSize + 'px';

    sidebarItems.forEach((el, i) => el.classList.toggle('active', i === index));

    btnPrev.disabled = index === 0;
    btnNext.disabled = index === list.length - 1;
    document.querySelector('.content').scrollTop = 0;
    window.scrollTo(0, 0);
    closeSidebar();
  }

  sidebarItems.forEach((el) => {
    el.addEventListener('click', () => renderContent(Number(el.dataset.index)));
  });

  btnPrev.addEventListener('click', () => { if (currentIndex > 0) renderContent(currentIndex - 1); });
  btnNext.addEventListener('click', () => { if (currentIndex < list.length - 1) renderContent(currentIndex + 1); });

  // ===== 顶部：上一部 / 下一部 跳转到相邻网页 =====
  function baseName(p) {
    return decodeURIComponent(p.split('/').pop() || '');
  }
  function currentBookIndex() {
    const file = baseName(location.pathname);
    const i = booksNav.findIndex(b => baseName(b.page) === file);
    return i >= 0 ? i : 0;
  }
  function updateBookNav() {
    const bi = currentBookIndex();
    const home = booksNav[0];
    const isHome = baseName(location.pathname) === baseName(home.page);
    btnPrevTop.disabled = isHome;
    btnPrevTop.textContent = isHome ? '＜ 上一部' : '＜ ' + home.name;
    if (bi >= booksNav.length - 1) {
      btnNextTop.disabled = true;
      btnNextTop.textContent = '下一部 ＞';
    } else {
      btnNextTop.disabled = false;
      btnNextTop.textContent = booksNav[bi + 1].name + ' ＞';
    }
  }
  function goBook(dir) {
    const bi = currentBookIndex();
    let target = booksNav[bi + dir];
    if (dir < 0) target = booksNav[0];
    if (target) location.href = target.page;
  }
  btnPrevTop.addEventListener('click', () => goBook(-1));
  btnNextTop.addEventListener('click', () => goBook(1));

  // 字号：A- 减小，A+ 增大
  btnMinus.addEventListener('click', () => {
    fontSize = Math.max(13, fontSize - 1);
    contentBody.style.fontSize = fontSize + 'px';
  });
  btnPlus.addEventListener('click', () => {
    fontSize = Math.min(24, fontSize + 1);
    contentBody.style.fontSize = fontSize + 'px';
  });

  // 日夜模式：切换图标，状态记忆
  btnSun.addEventListener('click', () => {
    darkMode = !darkMode;
    localStorage.setItem('darkMode', darkMode ? '1' : '0');
    applyTheme();
  });

  btnMenu.addEventListener('click', toggleSidebar);
  mask.addEventListener('click', closeSidebar);

  // 背景音乐：点一下播放，再点暂停，图标切换
  btnMusic.addEventListener('click', () => {
    if (bgMusic.paused) {
      bgMusic.play();
      btnMusic.textContent = '🔇';
    } else {
      bgMusic.pause();
      btnMusic.textContent = '🎵';
    }
  });

  // 浏览器限制：页面打开不能直接出声；用户首次点击页面任意位置后自动播放一次
  document.body.addEventListener('click', function startAutoPlay() {
    bgMusic.play();
    btnMusic.textContent = '🔇';
    document.body.removeEventListener('click', startAutoPlay);
  }, { once: true });

  applyTheme();
  updateBookNav();
  renderContent(0);
</script>
</body>
</html>
