<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幼科杂病心法要诀</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"SimSun","宋体","STSong",serif; }
  body {
    background:#f4ece0; color:#5a3418; line-height:1.8; min-height:100vh;
    transition:background-color .3s, color .3s;
  }
  body.dark-mode { background:#2d241a; color:#e8d5b8; }

  /* ===== 顶部栏（固定在顶部，滚动正文不移动） ===== */
  .top-bar {
    position:sticky; top:0; z-index:1001;
    height:56px; background:linear-gradient(180deg,#f4d9b0,#e7c99a);
    border-bottom:1px solid #d9b382; display:flex; align-items:center;
    justify-content:space-between; padding:0 16px; gap:10px; flex-wrap:wrap;
    box-shadow:0 2px 6px rgba(0,0,0,0.12);
  }
  body.dark-mode .top-bar { background:#3d3022; border-color:#5a4433; box-shadow:0 2px 6px rgba(0,0,0,0.3); }
  .top-left { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .book-title { font-size:17px; font-weight:bold; color:#6b3a17; letter-spacing:2px; }
  body.dark-mode .book-title { color:#e8d5b8; }
  .top-btn {
    background:#b45a1e; color:#fff; border:none; border-radius:10px;
    padding:8px 14px; font-size:14px; cursor:pointer; white-space:nowrap;
    font-family:inherit;
  }
  .top-btn:hover { background:#964815; }
  .top-btn:disabled { background:#b9b2a8; cursor:not-allowed; }

  /* 右上角圆形图标按钮 */
  .top-right { display:flex; gap:10px; align-items:center; }
  .icon-btn {
    width:38px; height:38px; border:none; border-radius:50%;
    background:linear-gradient(90deg,#8b4513,#d2691e); color:#fff;
    font-size:16px; cursor:pointer; display:flex; align-items:center;
    justify-content:center; line-height:1; padding:0; flex:0 0 38px;
  }
  .icon-btn:hover { filter:brightness(1.1); }
  .icon-btn:disabled { background:#b9b2a8; cursor:not-allowed; }

  /* ===== 主体：左导航（固定不动） + 右内容（独立滚动） ===== */
  .main { height:calc(100vh - 56px); }

  .sidebar {
    width:260px; background:#f4ece0; border-right:2px solid #d9b382;
    overflow-y:auto; padding:12px;
    position:fixed; left:0; top:56px; bottom:0; z-index:1000;
    transition:left .3s ease;
  }
  body.dark-mode .sidebar { background:#3d3022; border-color:#5a4433; }
  .sidebar-title {
    font-size:15px; color:#6b3a17; padding:8px 10px; margin-bottom:8px;
    border-bottom:1px dashed #d9b382;
  }
  body.dark-mode .sidebar-title { color:#e8d5b8; }
  .sidebar-item {
    background:#b45a1e; color:#fff; padding:14px 16px; border-radius:14px;
    margin-bottom:12px; font-size:16px; cursor:pointer; text-align:center;
    letter-spacing:1px; transition:background .2s; word-break:break-word;
    width:100%; flex:0 0 auto; user-select:none;
    border:2px solid transparent;
  }
  .sidebar-item:hover { filter:brightness(1.1); }
  .sidebar-item.active { background:#964815; border-color:#6b3a17; }

  .content { margin-left:260px; background:#fff; height:calc(100vh - 56px); overflow-y:auto; padding:30px; }
  body.dark-mode .content { background:#2d241a; }

  /* 手机抽屉遮罩 */
  .mask { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:999; display:none; }
  .mask.show { display:block; }

  .content-header {
    text-align:center; padding-bottom:20px; margin-bottom:24px;
    border-bottom:1px solid #e6d5c0;
  }
  body.dark-mode .content-header { border-color:#5a4433; }
  .content-header .section { font-size:15px; color:#8a7258; margin-bottom:6px; }
  .content-header .title { font-size:28px; color:#6b3a17; font-weight:bold; letter-spacing:4px; }
  body.dark-mode .content-header .title { color:#e8d5b8; }

  .content-body { font-size:17px; }
  .content-body p { font-size:inherit; line-height:2; margin-bottom:16px; text-indent:2em; }
  .content-body .label { font-weight:bold; color:#b45a1e; }
  body.dark-mode .content-body .label { color:#e8d5b8; }

  .bottom-bar {
    display:flex; justify-content:space-between; align-items:center;
    margin-top:30px; padding-top:16px; border-top:1px solid #e6d5c0; gap:10px;
  }
  body.dark-mode .bottom-bar { border-color:#5a4433; }
  .page-btn {
    background:#b45a1e; color:#fff; border:none; border-radius:10px;
    padding:10px 18px; font-size:15px; cursor:pointer; font-family:inherit;
  }
  .page-btn:hover { background:#964815; }
  .page-btn:disabled { background:#b9b2a8; cursor:not-allowed; }
  .page-info { font-size:14px; color:#8a7258; }
  body.dark-mode .page-info { color:#c9b293; }

  @media (max-width:768px) {
    .sidebar { left:-260px; }
    .sidebar.open { left:0; }
    .content { margin-left:0; padding:20px 16px; }
    .content-header .title { font-size:22px; }
  }
</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="top-bar">
  <div class="top-left">
    <div class="book-title">幼科杂病心法要诀</div>
    <button class="icon-btn" id="btn-menu" title="目录">☰</button>
    <button class="top-btn" id="btn-prev-top">＜ 上一部</button>
    <button class="top-btn" id="btn-next-top">下一部 ＞</button>
  </div>
  <div class="top-right">
    <button class="icon-btn" id="btn-font-minus" title="减小字号">A-</button>
    <button class="icon-btn" id="btn-font-plus" title="增大字号">A+</button>
    <button class="icon-btn" id="btn-sun" title="切换古籍/日间模式">🌙</button>
    <button class="icon-btn" id="btn-music" title="背景音乐">🎵</button>
  </div>
</div>

<!-- 背景音乐：autoplay 自动播放，loop 循环；muted 先静音以通过浏览器自动播放限制，首次点击后取消静音 -->
<audio id="bgMusic" autoplay loop muted>
  <source src="mp3/你走以后我才敢说爱你 - 山野葫芦.mp3" type="audio/mpeg">
</audio>

<!-- 主体 -->
<div class="mask" id="mask"></div>
<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-title">幼科杂病心法要诀</div>
    <div class="sidebar-item" data-index="0">幼科杂病心法要诀</div>
    <div class="sidebar-item" data-index="1"></div>
    <div class="sidebar-item" data-index="2"></div>
    <div class="sidebar-item" data-index="3"></div>
    <div class="sidebar-item" data-index="4"></div>
    <div class="sidebar-item" data-index="5"></div>
    <div class="sidebar-item" data-index="6"></div>
    <div class="sidebar-item" data-index="7"></div>
    <div class="sidebar-item" data-index="8"></div>
    <div class="sidebar-item" data-index="9"></div>
    <div class="sidebar-item" data-index="10"></div>
    <div class="sidebar-item" data-index="11"></div>
    <div class="sidebar-item" data-index="12"></div>
    <div class="sidebar-item" data-index="13"></div>
    <div class="sidebar-item" data-index="14"></div>
    <div class="sidebar-item" data-index="15"></div>
    <div class="sidebar-item" data-index="16"></div>
    <div class="sidebar-item" data-index="17"></div>
    <div class="sidebar-item" data-index="18"></div>
  </div>

  <div class="content">
    <div class="content-header">
      <div class="section">幼科杂病心法要诀</div>
      <div class="title" id="content-title">幼科杂病心法要诀</div>
    </div>

    <div class="content-body" id="content-body"></div>

    <div class="bottom-bar">
      <button class="page-btn" id="btn-prev">上一篇</button>
      <div class="page-info" id="page-info">第 1 篇 / 共 19 篇</div>
      <button class="page-btn" id="btn-next">下一篇</button>
    </div>
  </div>
</div>

<script>
  // ===== 篇目数据：original 原文 / translation 译文 / analysis 简析；留空则显示待录入 =====
  const list = [
    { title: "幼科杂病心法要诀",original: "", translation: "",analysis: "" },
    { title: "",original: "", translation: "",analysis: "" },
    { title: "",original: "", translation: "",analysis: "" },
    { title: "",original: "", translation: "",analysis: "" },
    { title: "",original: "", translation: "",analysis: "" },
    { title: "",original: "", translation: "",analysis: "" },
    { title: "",original: "", translation: "",analysis: "" },
    { title: "",original: "", translation: "",analysis: "" },
    { title: "",original: "", translation: "",analysis: "" },
    { title: "",original: "", translation: "",analysis: "" },
    { title: "",original: "", translation: "",analysis: "" },
    { title: "",original: "", translation: "",analysis: "" },
    { title: "",original: "", translation: "",analysis: "" },
    { title: "",original: "", translation: "",analysis: "" }
  ];

  // ===== 跨网页导航：上一部 / 下一部 跳转到相邻 html 文件 =====
  const booksNav = [
    { name: "妇科心法要诀", page: "08妇科心法要诀.html" },
    { name: "幼科杂病心法要诀", page: "09幼科杂病心法要诀.html" },
    { name: "痘疹心法要诀", page: "10痘疹心法要诀.html" }
  ];

  let currentIndex = 0;
  let fontSize = 17;
  let darkMode = localStorage.getItem('darkMode') === '1';

  const sidebarItems = document.querySelectorAll('.sidebar-item');
  const contentTitle = document.getElementById('content-title');
  const contentBody = document.getElementById('content-body');
  const pageInfo = document.getElementById('page-info');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const btnPrevTop = document.getElementById('btn-prev-top');
  const btnNextTop = document.getElementById('btn-next-top');
  const btnMinus = document.getElementById('btn-font-minus');
  const btnPlus = document.getElementById('btn-font-plus');
  const btnSun = document.getElementById('btn-sun');
  const btnMenu = document.getElementById('btn-menu');
  const sidebar = document.getElementById('sidebar');
  const mask = document.getElementById('mask');
  const btnMusic = document.getElementById('btn-music');
  const bgMusic = document.getElementById('bgMusic');

  // 手机端抽屉：打开/关闭侧栏，同步遮罩
  function toggleSidebar() {
    sidebar.classList.toggle('open');
    mask.classList.toggle('show');
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    mask.classList.remove('show');
  }

  function applyTheme() {
    document.body.classList.toggle('dark-mode', darkMode);
    btnSun.textContent = darkMode ? '☀' : '🌙';
    btnSun.title = darkMode ? '切换到日间模式' : '切换到古籍模式';
  }

  function renderContent(index) {
    currentIndex = index;
    const item = list[index];
    contentTitle.textContent = item.title;
    pageInfo.textContent = '第 ' + (index + 1) + ' 篇 / 共 ' + list.length + ' 篇';

    // 组装正文：原文 / 译文 / 简析；任一字段为空就跳过，全空显示待录入
    let html = '';
    if (item.original && item.original.trim()) {
      html += '<p><span class="label">【原文】</span>' + item.original + '</p>';
    }
    if (item.translation && item.translation.trim()) {
      html += '<p><span class="label">【译文】</span>' + item.translation + '</p>';
    }
    if (item.analysis && item.analysis.trim()) {
      html += '<p><span class="label">【简析】</span>' + item.analysis + '</p>';
    }
    if (!html) {
      html = '<p style="text-align:center;color:#8a7258;">待录入原文</p>';
    }
    contentBody.innerHTML = html;
    contentBody.style.fontSize = fontSize + 'px';

    sidebarItems.forEach((el, i) => el.classList.toggle('active', i === index));

    btnPrev.disabled = index === 0;
    btnNext.disabled = index === list.length - 1;
    document.querySelector('.content').scrollTop = 0;
    window.scrollTo(0, 0);
    closeSidebar();
  }

  sidebarItems.forEach((el) => {
    el.addEventListener('click', () => renderContent(Number(el.dataset.index)));
  });

  btnPrev.addEventListener('click', () => { if (currentIndex > 0) renderContent(currentIndex - 1); });
  btnNext.addEventListener('click', () => { if (currentIndex < list.length - 1) renderContent(currentIndex + 1); });

  // ===== 顶部：上一部 / 下一部 跳转到相邻网页 =====
  function baseName(p) {
    return decodeURIComponent(p.split('/').pop() || '');
  }
  function currentBookIndex() {
    const file = baseName(location.pathname);
    const i = booksNav.findIndex(b => baseName(b.page) === file);
    return i >= 0 ? i : 0;
  }
  function updateBookNav() {
    const bi = currentBookIndex();
    const home = booksNav[0];
    const isHome = baseName(location.pathname) === baseName(home.page);
    btnPrevTop.disabled = isHome;
    btnPrevTop.textContent = isHome ? '＜ 上一部' : '＜ ' + home.name;
    if (bi >= booksNav.length - 1) {
      btnNextTop.disabled = true;
      btnNextTop.textContent = '下一部 ＞';
    } else {
      btnNextTop.disabled = false;
      btnNextTop.textContent = booksNav[bi + 1].name + ' ＞';
    }
  }
  function goBook(dir) {
    const bi = currentBookIndex();
    let target = booksNav[bi + dir];
    if (dir < 0) target = booksNav[0];
    if (target) location.href = target.page;
  }
  btnPrevTop.addEventListener('click', () => goBook(-1));
  btnNextTop.addEventListener('click', () => goBook(1));

  // 字号：A- 减小，A+ 增大
  btnMinus.addEventListener('click', () => {
    fontSize = Math.max(13, fontSize - 1);
    contentBody.style.fontSize = fontSize + 'px';
  });
  btnPlus.addEventListener('click', () => {
    fontSize = Math.min(24, fontSize + 1);
    contentBody.style.fontSize = fontSize + 'px';
  });

  // 日夜模式：切换图标，状态记忆
  btnSun.addEventListener('click', () => {
    darkMode = !darkMode;
    localStorage.setItem('darkMode', darkMode ? '1' : '0');
    applyTheme();
  });

  btnMenu.addEventListener('click', toggleSidebar);
  mask.addEventListener('click', closeSidebar);

  // 背景音乐：自动播放（先静音通过浏览器限制）；按钮切换播放/暂停
  function syncMusicIcon() {
    btnMusic.textContent = bgMusic.paused ? '🎵' : '🔇';
  }

  // 页面加载后尝试自动播放；muted 状态下多数浏览器允许
  bgMusic.play().then(() => {
    syncMusicIcon();
  }).catch(() => {
    // 被拦截则保持暂停，等首次点击再播
    syncMusicIcon();
  });

  btnMusic.addEventListener('click', () => {
    // 手动点按钮时取消静音，正常出声
    bgMusic.muted = false;
    if (bgMusic.paused) {
      bgMusic.play();
    } else {
      bgMusic.pause();
    }
    syncMusicIcon();
  });

  // 首次点击页面任意位置：取消静音并播放（浏览器要求有一次交互才能出声）
  document.body.addEventListener('click', function startAutoPlay() {
    bgMusic.muted = false;
    bgMusic.play();
    syncMusicIcon();
    document.body.removeEventListener('click', startAutoPlay);
  }, { once: true });

  applyTheme();
  updateBookNav();
  renderContent(0);
</script>
</body>
</html>
