<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>本草纲目,医宗金鉴,中医名著古籍大全,中医书籍在线阅读,在线学习中医</title>
<meta name="description" content="本草纲目,中医宝典,医宗金鉴,中医书籍,中医名著,中医古籍,中医书籍大全" />
<meta name="keywords" content="医典包括中医书籍有:中药大全,方剂大全,中医经论,中医伤寒,中医金匮,中医诊治,中医本草,中医方言,中医内科,中医外科,中医儿科,中医妇科,中医五官,中医针灸,中医医论" />
<link rel="shortcut icon" href="images/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SimSun', '宋体', 'STSong', serif;
            background-color: #f4f1e8;
            color: #4a3728;
            line-height: 1.8;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-mode {
            background-color: #2d241a;
            color: #e8d5b8;
        }

        .book-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0;
            position: relative;
        }

        .book-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #8b4513 33%, #d2691e 33%, #d2691e 66%, #8b4513 66%);
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #e8d5b8 0%, #f4f1e8 100%);
            border-right: 3px double #8b4513;
            padding: 20px 15px;
            position: fixed;
            left: 0;
            top: 20px;
            bottom: 20px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        body.dark-mode .sidebar {
            background: linear-gradient(180deg, #4a3728 0%, #2d241a 100%);
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }

        .sidebar h2 {
            font-size: 24px;
            color: #8b4513;
            text-align: center;
            padding-bottom: 15px;
            margin-bottom: 15px;
            border-bottom: 2px solid #8b4513;
            letter-spacing: 3px;
        }

        body.dark-mode .sidebar h2 {
            color: #e8d5b8;
        }

        /* 左侧部名导航：不再展开小类目，点击直接跳转 */
        .dept-nav {
            list-style: none;
        }

        .dept-nav li {
            padding: 12px 14px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #d2691e 0%, #8b4513 100%);
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 2px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }

        .dept-nav li:hover {
            background: linear-gradient(90deg, #8b4513 0%, #d2691e 100%);
            transform: translateX(4px);
        }

        .dept-nav li.active {
            outline: 2px solid #4a3728;
        }

        .main-content {
            margin-left: 280px;
            padding: 30px 40px;
            min-height: 100vh;
        }

        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            font-family: 'SimSun', serif;
            font-size: 16px;
            border: 2px solid #8b4513;
            border-radius: 25px;
            background-color: rgba(255,255,255,0.8);
            color: #4a3728;
            transition: all 0.3s;
        }

        body.dark-mode .search-box input {
            background-color: rgba(0,0,0,0.3);
            color: #e8d5b8;
        }

        .search-box input:focus {
            outline: none;
            border-color: #d2691e;
            box-shadow: 0 0 10px rgba(210, 105, 30, 0.3);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b4513;
        }

        body.dark-mode .search-icon {
            color: #e8d5b8;
        }

        .pagination {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .pagination button {
            padding: 10px 20px;
            font-family: 'SimSun', serif;
            font-size: 15px;
            background: linear-gradient(90deg, #8b4513 0%, #d2691e 100%);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pagination button:hover {
            background: linear-gradient(90deg, #d2691e 0%, #8b4513 100%);
            transform: translateY(-2px);
        }

        .pagination button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .font-controls {
            display: flex;
            gap: 10px;
        }

        .font-controls button {
            width: 35px;
            height: 35px;
            padding: 0;
            font-family: 'SimSun', serif;
            font-size: 12px;
            background: linear-gradient(90deg, #8b4513 0%, #d2691e 100%);
            color: #fff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .font-controls button:hover {
            transform: scale(1.1);
        }

        .theme-toggle {
            padding: 5px 15px;
            font-family: 'SimSun', serif;
            background: linear-gradient(90deg, #8b4513 0%, #d2691e 100%);
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
        }

        .volume-info {
            text-align: center;
            padding: 15px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, rgba(139,69,19,0.1) 0%, transparent 100%);
            border-radius: 5px;
        }

        body.dark-mode .volume-info {
            background: linear-gradient(90deg, rgba(232,213,184,0.1) 0%, transparent 100%);
        }

        .volume-info strong {
            color: #8b4513;
            font-size: 18px;
            letter-spacing: 2px;
        }

        body.dark-mode .volume-info strong {
            color: #e8d5b8;
        }

        /* 右侧部卡片 */
        .dept-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .dept-card {
            background: linear-gradient(180deg, #fff 0%, #f9f5eb 100%);
            border: 1px solid #d4c4a8;
            border-radius: 8px;
            padding: 28px 20px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s;
        }

        body.dark-mode .dept-card {
            background: linear-gradient(180deg, #3d3022 0%, #2d241a 100%);
            border-color: #5a4433;
        }

        .dept-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            border-color: #8b4513;
        }

        .dept-card .card-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .dept-card .card-name {
            font-size: 22px;
            color: #8b4513;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 6px;
        }

        body.dark-mode .dept-card .card-name {
            color: #e8d5b8;
        }

        .dept-card .card-desc {
            font-size: 13px;
            color: #a07040;
        }

        .no-result {
            text-align: center;
            padding: 50px;
            color: #8b4513;
        }

        body.dark-mode .no-result {
            color: #e8d5b8;
        }

        .no-result::before {
            content: '📚';
            font-size: 60px;
            display: block;
            margin-bottom: 20px;
        }

        .menu-btn {
            display: none;
            position: fixed;
            left: 16px;
            top: 16px;
            z-index: 3000;
            background: #8b4513;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            font-size: 20px;
            align-items: center;
            justify-content: center;
        }

        .mask { display: none; }

        @media (max-width: 1200px) {
            .sidebar { width: 240px; }
            .main-content { margin-left: 240px; padding: 20px 25px; }
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -280px;
                top: 0;
                bottom: 0;
                z-index: 2000;
                transition: left .3s ease;
            }
            .sidebar.open { left: 0; }
            .main-content { margin-left: 0; padding: 16px 14px; }
            .menu-btn { display: flex; }
            .mask {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,.4);
                z-index: 1900;
            }
            .mask.hide { display: none; }
            .top-controls { gap: 10px; }
            .search-box { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="book-container">
        <div class="sidebar" id="sidebar">
            <h2>目录</h2>
            <ul class="dept-nav" id="dept-nav"></ul>
        </div>

        <div class="main-content">
            <div class="top-controls">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="🔍 搜索部类名称...">
                    <span class="search-icon">🔍</span>
                </div>
                <div class="pagination">
                    <button onclick="prevDept()" id="prev-btn" disabled>❮ 上一部</button>
                    <button onclick="nextDept()" id="next-btn">下一部 ❯</button>
                </div>
            </div>

            <div class="font-controls">
                <button onclick="adjustFontSize(-1)">A-</button>
                <button onclick="adjustFontSize(1)">A+</button>
                <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
				
            </div>

            <div class="volume-info" id="volume-info">
                <strong> <h1>本草纲目</h1></strong>
            </div>
            <div id="content-area"></div>
        </div>
    </div>

    <button class="menu-btn" onclick="toggleSidebar()" id="mobile-menu-btn">☰</button>
    <div class="mask hide" id="mask" onclick="toggleSidebar()"></div>

    <script>
        // ================= 部类目录：name 部名，page 跳转的新建页面文件 =================
        const books = [
            { name: "书籍",   department: "首页",   page: "index.html",   icon: "首页", desc: "目录" },
            { name: "水部",   department: "水",   page: "shui.html",   icon: "💧", desc: "水类药物" },
            { name: "火部",   department: "火",   page: "huo.html",    icon: "🔥", desc: "火类药物" },
            { name: "土部",   department: "土",   page: "tu.html",      icon: "🟫", desc: "土类药物" },
            { name: "金石部", department: "金石", page: "jinshi.html", icon: "🪨", desc: "金石矿物" },
            { name: "草部",   department: "草",   page: "cao.html",    icon: "🌿", desc: "草本药物" },
            { name: "谷部",   department: "谷",   page: "gu.html",      icon: "🌾", desc: "五谷豆类" },
            { name: "菜部",   department: "菜",   page: "cai.html",    icon: "🥬", desc: "蔬菜类" },
            { name: "果部",   department: "果",   page: "guo.html",     icon: "🍎", desc: "水果类" },
            { name: "木部",   department: "木",   page: "mu.html",      icon: "🌳", desc: "木本药物" },
            { name: "服器部", department: "服器", page: "fuqi.html",   icon: "🧺", desc: "衣物器物类" },
            { name: "虫部",   department: "虫",   page: "chong.html",   icon: "🐛", desc: "虫类药物" },
            { name: "鳞部",   department: "鳞",   page: "lin.html",     icon: "🐟", desc: "鳞甲水族" },
            { name: "介部",   department: "介",   page: "jie.html",     icon: "🐚", desc: "贝类甲壳" },
            { name: "禽部",   department: "禽",   page: "qin.html",     icon: "🐦", desc: "禽类药物" },
            { name: "兽部",   department: "兽",   page: "shou.html",   icon: "🐂", desc: "兽类药物" },
            { name: "人部",   department: "人",   page: "ren.html",     icon: "👤", desc: "人部药材" }
        ];

        let currentDept = 0;
        let searchTimeout = null;
        let fontSize = 16;
        let isDarkMode = false;

        document.addEventListener('DOMContentLoaded', function() {
            currentDept = detectDept();
            renderSidebar();
            renderGrid();
            setupEventListeners();
            updateNavButtons();
        });

        // 根据当前页面文件名或 URL 参数 (?dept=cao) 识别当前是哪一部
        function detectDept() {
            const params = new URLSearchParams(location.search);
            const p = params.get('dept');
            if (p) {
                const i = books.findIndex(b => b.page === p + '.html' || b.page === p);
                if (i >= 0) return i;
            }
            const file = decodeURIComponent(location.pathname.split('/').pop());
            const i = books.findIndex(b => b.page === file);
            return i >= 0 ? i : 0;
        }

        // 跳转到指定部对应的新建页面
        function goPage(book) {
            window.location.href = book.page;
        }

        // 左侧目录（无小类目，点击直接跳转）
        function renderSidebar() {
            const nav = document.getElementById('dept-nav');
            nav.innerHTML = '';
            books.forEach((book, idx) => {
                const li = document.createElement('li');
                li.textContent = book.name;
                li.dataset.index = idx;
                li.onclick = () => goPage(book);
                nav.appendChild(li);
            });
        }

        // 右侧部卡片
        function renderGrid(list) {
            const area = document.getElementById('content-area');
            const data = list || books;
            area.innerHTML = `<div class="dept-grid">` + data.map(book => `
                <div class="dept-card" data-page="${book.page}">
                    <div class="card-icon">${book.icon}</div>
                    <div class="card-name">${book.name}</div>
                    <div class="card-desc">${book.desc}</div>
                </div>
            `).join('') + `</div>`;

            area.querySelectorAll('.dept-card').forEach(card => {
                card.onclick = () => {
                    const book = books.find(b => b.page === card.dataset.page);
                    if (book) goPage(book);
                };
            });
        }

        function updateNavButtons() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            prevBtn.disabled = currentDept === 0;
            nextBtn.disabled = currentDept === books.length - 1;
            prevBtn.textContent = currentDept > 0 ? `❮ ${books[currentDept - 1].name}` : '❮ 上一部';
            nextBtn.textContent = currentDept < books.length - 1 ? `${books[currentDept + 1].name} ❯` : '下一部 ❯';
        }

        // 上一部 / 下一部：按当前部顺序直接跳转到对应新建页面
        function prevDept() {
            if (currentDept > 0) {
                currentDept--;
                updateNavButtons();
                goPage(books[currentDept]);
            }
        }

        function nextDept() {
            if (currentDept < books.length - 1) {
                currentDept++;
                updateNavButtons();
                goPage(books[currentDept]);
            }
        }

        function setupEventListeners() {
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', function(e) {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(function() {
                    const term = e.target.value.trim().toLowerCase();
                    if (term) {
                        const results = books.filter(b =>
                            b.name.toLowerCase().includes(term) ||
                            b.desc.toLowerCase().includes(term)
                        );
                        if (results.length > 0) {
                            renderGrid(results);
                        } else {
                            document.getElementById('content-area').innerHTML = `
                                <div class="no-result">
                                    <h2>📚 未找到相关部类</h2>
                                    <p>请尝试其他关键词</p>
                                </div>`;
                        }
                    } else {
                        renderGrid();
                    }
                }, 300);
            });

            const mobileMenuBtn = document.getElementById('mobile-menu-btn');
            mobileMenuBtn.onclick = function() {
                document.getElementById('sidebar').classList.toggle('open');
            };

            document.addEventListener('click', function(e) {
                const sidebar = document.getElementById('sidebar');
                const menuBtn = document.getElementById('mobile-menu-btn');
                if (window.innerWidth <= 768 &&
                    !sidebar.contains(e.target) &&
                    !menuBtn.contains(e.target) &&
                    sidebar.classList.contains('open')) {
                    closeSidebar();
                }
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    closeSidebar();
                }
            });
        }

        function adjustFontSize(delta) {
            fontSize = Math.max(12, Math.min(24, fontSize + delta));
            document.body.style.fontSize = fontSize + 'px';
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode', isDarkMode);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('mask').classList.toggle('hide');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('mask').classList.add('hide');
        }
    </script>

    </div>
</body>
</html>
