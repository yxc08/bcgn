        "name": "山药",
        "content": {
          "释名": "《本草纲目》：山药本名薯蓣，因避唐代宗讳改薯药，又避宋英宗讳改山药。\n生嵩山山谷，春生苗，蔓缘篱壁，根白而长。",
          "气味": "甘，平，无毒。",
          "主治": "主伤中，补虚羸，除寒热邪气，补中益气力，长肌肉。\n久服耳目聪明，益肾气，健脾胃。",
          "发明": "李时珍曰：山药甘平，脾肺肾三脏同补，不燥不腻，为清补之品。\n然湿盛中满、大便溏滑者不宜多食。",
          "附方": "《经验方》：山药半斤（焙），莲子肉二两，芡实二两。\n上三味为末，每服三钱，米汤调下。\n\n山药粥：山药捣碎，和米煮粥，早晚食之，健脾养胃。"
        }
      },
      {
        "name": "黄连",
        "content": {
          "释名": "《别录》曰：黄连生巫阳川谷，四月采根，根连珠而色黄，故名。",
          "气味": "苦，寒，无毒。",
          "主治": "主热气目痛，眦伤泪出，明目，肠澼腹痛下痢，妇人阴中肿痛。\n清热燥湿，泻火解毒。",
          "发明": "李时珍曰：黄连大苦大寒，泻心火，清湿热，治痢疾口疮之要药。\n苦寒伤胃，脾胃虚寒者忌用。",
          "附方": "《肘后方》：黄连三两，黄芩二两，黄柏二两，栀子十四枚。\n水六升，煮取二升，分二服，泻火解毒。\n\n香连丸：黄连、木香，研末为丸，米饮送下，治赤白痢疾。"
        }
      },
      {
        "name": "黄芩",
        "content": {
          "释名": "《本草纲目》：黄芩以色黄得名，一月采根，中空者为枯芩，实者为子芩。",
          "气味": "苦，寒，无毒。",
          "主治": "主诸热黄疸，肠澼泄痢，逐水，下血闭，恶疮疽蚀火疡。\n清热燥湿，泻火解毒，止血安胎。",
          "发明": "李时珍曰：黄芩苦寒，清肺与大肠之火，枯芩偏于清上焦，子芩偏于清下焦。\n脾胃虚寒、无湿热者不宜。",
          "附方": "《金匮要略》：黄芩三两，芍药二两，甘草二两，大枣十二枚。\n水五升，煮取二升，分三服。\n\n黄芩汤：治太阳少阳合病下利。"
        }
      },
      {
        "name": "柴胡",
        "content": {
          "释名": "《别录》曰：柴胡生洪农山谷，二月、八月采根，叶似韭而稍阔，根红紫色。",
          "气味": "苦，平，无毒。",
          "主治": "主心腹肠胃中结气，饮食积聚，寒热邪气，推陈致新。\n疏肝解郁，升举阳气，和解表里。",
          "发明": "李时珍曰：柴胡苦平，主少阳胆经，为和解表里、疏肝升阳之要药。\n肝阳上亢、阴虚火旺者慎用。",
          "附方": "《伤寒论》：柴胡四两，黄芩三两，人参三两，半夏半升，甘草三两，生姜三两，大枣十二枚。\n水一斗二升，煮取六升，去滓再煎，温服一升，日三服。\n\n小柴胡汤：和解少阳，治往来寒热。"
        }
      },
      {
        "name": "半夏",
        "content": {
          "释名": "《礼记·月令》：五月半夏生，盖当夏之半，故名。\n生槐里川谷，五月采根，圆如半夏，须炮制用。",
          "气味": "辛，温，有毒。",
          "主治": "主伤寒寒热，心下坚，下气，喉咽肿痛，头眩胸胀，咳逆肠鸣，止汗。\n燥湿化痰，降逆止呕，消痞散结。",
          "发明": "李时珍曰：半夏辛温有毒，燥湿化痰，和胃止呕，然内服须姜制，以制其毒。\n一切血证及阴虚燥咳者忌用。",
          "附方": "《伤寒论》：半夏半升（洗），黄芩三两，干姜三两，人参三两，甘草三两，黄连一两，大枣十二枚。\n水一斗，煮取六升，去滓再煎，温服一升。\n\n半夏泻心汤：治心下痞满，呕而肠鸣。"
        }
      },
      {
        "name": "桔梗",
        "content": {
          "释名": "《本草纲目》：桔梗根结实而梗直，故名。\n生嵩高山谷，二月、八月采根，色白，叶似杏叶。",
          "气味": "辛，微温，无毒。",
          "主治": "主胸胁痛如刀刺，腹满肠鸣幽幽，惊恐悸气。\n宣肺利咽，祛痰排脓，载药上行。",
          "发明": "李时珍曰：桔梗苦辛，开宣肺气，为舟楫之剂，能引诸药上达胸膈肺经。\n阴虚久嗽、气逆咳血者慎用。",
          "附方": "《千金方》：桔梗三两，甘草二两。\n水三升，煮取一升，分二服，治咽痛失音。\n\n桔梗汤：清肺利咽，排脓解毒。"
        }
      },
      {
        "name": "防风",
        "content": {
          "释名": "《本草纲目》：防风御风寒，故名。\n生沙苑川泽，二月、十月采根，根黄棕色，叶似青蒿。",
          "气味": "辛，温，无毒。",
          "主治": "主大风头眩痛，恶风风邪，目盲无所见，风行周身，骨节痹痛。\n祛风解表，胜湿止痛，止痉。",
          "发明": "李时珍曰：防风辛温，为治风通用之品，散风寒湿痹，又能疏肝脾。\n血虚发痉、阴虚火旺者不宜。",
          "附方": "《本事方》：防风二两，黄芪二两，白术二两。\n研末，每服三钱，水煎服，固表祛风。\n\n玉屏风散：御风固表，治自汗易感风邪。"
        }
      },
      {
        "name": "薄荷",
        "content": {
          "释名": "《本草纲目》：薄荷俗称蕃荷，茎叶有特殊香气，八月采茎叶，阴干。",
          "气味": "辛，凉，无毒。",
          "主治": "主贼风伤寒，发汗，恶风气胀，霍乱，宿食不消，下气。\n疏散风热，清利头目，利咽透疹，疏肝行气。",
          "发明": "李时珍曰：薄荷辛凉轻清，上行头目，散风热，利咽喉。\n体虚多汗者不宜多服。",
          "附方": "《经验方》：薄荷、桑叶、菊花、桔梗各等分。\n水二盏，煎一盏，温服，治风热头痛咽痛。\n\n薄荷茶：薄荷叶少许，泡水温饮，清头目。"
        }
      },
      {
        "name": "紫苏",
        "content": {
          "释名": "《本草纲目》：紫苏以叶色紫得名，五月采叶，九月采子，茎亦入药。",
          "气味": "辛，温，无毒。",
          "主治": "主下气，杀谷，除饮食，辟口臭，去邪毒，辟恶气。\n解表散寒，行气和胃，解鱼蟹毒。",
          "发明": "李时珍曰：紫苏辛温，入肺脾二经，发散风寒，理气宽中，兼解鱼蟹之毒。\n阴虚火旺、气虚多汗者慎服。",
          "附方": "《金匮要略》：紫苏叶三两，生姜三两，大枣十二枚。\n水五升，煮取二升，分温三服。\n\n苏叶饮：苏叶、陈皮、生姜，水煎，治妊娠恶阻及食蟹中毒。"
        }
      },
      {
        "name": "麻黄",
        "content": {
          "释名": "《本草纲目》：麻黄一名龙沙，生晋地，立秋后采茎，根亦入药。",
          "气味": "辛，温，无毒。",
          "主治": "主中风伤寒头痛，温疟，发表出汗，去邪热气，止咳逆上气，除寒热，破癥坚积聚。\n发汗解表，宣肺平喘，利水消肿。",
          "发明": "李时珍曰：麻黄辛温，发汗力猛，为解表第一要药；表虚自汗、阴虚盗汗者忌用。\n麻黄根则止汗，与茎性相反，不可混用。",
          "附方": "《伤寒论》：麻黄三两（去节），桂枝二两，甘草一两，杏仁七十个。\n水九升，先煮麻黄减二升，去上沫，内诸药，煮取二升半，温服八合。\n\n麻黄汤：发汗解表，宣肺平喘。"
        }
      },
      {
        "name": "菊花",
        "content": {
          "释名": "《本草纲目》：菊一名节华，九月开花，黄者名黄菊，白者名白菊，陈者良。",
          "气味": "苦，平，无毒。",
          "主治": "主风头眩肿痛，目欲脱，泪出，皮肤死肌，恶风湿痹。\n久服利血气，轻身耐老。\n散风清热，平肝明目，清热解毒。",
          "发明": "李时珍曰：菊花甘苦微寒，平肝明目，白菊偏于清肝益肺，黄菊偏于疏散风热。\n气虚胃寒、食少泄泻者少用。",
          "附方": "《经验方》：菊花、枸杞、山茱萸、地黄，研末蜜丸，每服二钱，温水送下。\n\n菊花茶：白菊少许，泡水温饮，清头明目。"
        }
      },
      {
        "name": "连翘",
        "content": {
          "释名": "《本草纲目》：连翘一名连壳，生于太山山谷，八月采实，茎秆翘然，故名。",
          "气味": "苦，平，无毒。",
          "主治": "主寒热，鼠瘘瘰疬，痈肿恶疮，瘿瘤结热，蛊毒。\n清热解毒，消肿散结，疏散风热。",
          "发明": "李时珍曰：连翘苦寒，清心火，解疮毒，为疮家圣药；与金银花相须，治风热外感及痈肿。\n脾胃虚寒、气虚脓清者不宜。",
          "附方": "《温病条辨》：连翘、金银花、桔梗、薄荷、竹叶、甘草、荆芥穗、淡豆豉、牛蒡子。\n水煎服，辛凉透表，清热解毒。\n\n银翘散：治风温初起，发热咽痛。"
        }
      },
      {
        "name": "葛根",
        "content": {
          "释名": "《本草纲目》：葛又名鹿藿，生梵屋山川谷，五月掘根，入土深者佳，粉白可食。",
          "气味": "甘，平，无毒。",
          "主治": "主消渴，身大热，呕吐，诸痹，起阴气，解诸毒。\n解肌退热，生津止渴，透疹升阳止泻。",
          "发明": "李时珍曰：葛根甘平，入脾胃经，能升发清阳，解肌表之热，生津止渴。\n夏日热病口渴者宜之，胃寒呕家慎用。",
          "附方": "《伤寒论》：葛根四两，麻黄三两，桂枝二两，芍药二两，甘草二两，生姜三两，大枣十二枚。\n水一斗，先煮葛根、麻黄，去沫，内诸药，煮取三升，温服一升。\n\n葛根汤：解肌发汗，治项背强几几。"
        }
      },
      {
        "name": "板蓝根",
        "content": {
          "释名": "《本草纲目》：板蓝根即蓝之根，叶名大青叶，生中山川谷，冬采根，夏采叶。",
          "气味": "苦，寒，无毒。",
          "主治": "主解诸毒，杀蛊蚑，疰鬼螫毒。\n清热解毒，凉血利咽，用于温毒发斑、咽喉肿痛。",
          "发明": "李时珍曰：板蓝根苦寒，凉血解毒，时行热病、大头瘟疫多用之。\n体虚无实火热毒者不宜，脾胃虚寒者忌服。",
          "附方": "《经验方》：板蓝根、连翘、金银花、甘草，水煎服。\n\n板蓝根饮：治温毒咽痛、发热。"
        }
      },
      {
        "name": "白芍",
        "content": {
          "释名": "《本草纲目》：芍药分赤白，白者色白入补，二月、八月采根，晒干用。",
          "气味": "苦，平，无毒。",
          "主治": "主邪气腹痛，除血痹，破坚积，寒热疝瘕，止痛，利小便，益气。\n养血调经，敛阴止汗，柔肝止痛，平抑肝阳。",
          "发明": "李时珍曰：白芍苦酸微寒，养血柔肝，缓急止痛；与甘草相配，治腹中挛急痛。\n阳衰虚寒、不宜酸味者慎用。",
          "附方": "《伤寒论》：芍药四两，甘草四两。\n水三升，煮取一升半，去滓，分温三服。\n\n芍药甘草汤：柔肝缓急，治脚挛急腹痛。"
        }
      },
      {
        "name": "当归",
        "content": {
          "释名": "《本草纲目》：当归一名乾归，生陇西川谷，二月、八月采根，肉厚气香，尾细者佳。",
          "气味": "甘、辛，温，无毒。",
          "主治": "主咳逆上气，温疟寒热，妇人漏下绝子，诸恶疮疡。补血活血，调经止痛，润肠通便。",
          "发明": "李时珍曰：当归甘温润血，为妇科调经要药；头补血，尾活血，身和血。湿盛中满、大便溏泄者慎用。",
          "附方": "《金匮要略》：当归三两，桂枝三两，芍药三两，细辛二两，通草二两，大枣二十五枚，甘草二两。水煎服，温经散寒。当归补血汤：当归、黄芪，水煎服，治血虚发热。"
        }
      },
      {
        "name": "川芎",
        "content": {
          "释名": "《本草纲目》：川芎一名香果，生武功川谷，八月采根，根节隆起如雀脑，香气辛烈。",
          "气味": "辛，温，无毒。",
          "主治": "主中风入脑头痛，寒痹筋挛缓急，妇人血闭无子。活血行气，祛风止痛，为血中气药。",
          "发明": "李时珍曰：川芎辛温香窜，上行头目，下调经水，中开郁结，头痛要药。阴虚火旺、上盛下虚者忌服。",
          "附方": "《经验方》：川芎、白芷、羌活、防风，水煎服，治头风头痛。川芎茶调散：川芎配荆芥、薄荷等，清茶调下，疏风止痛。"
        }
      },
      {
        "name": "地黄",
        "content": {
          "释名": "《本草纲目》：地黄一名地髓，生咸阳川泽，二月、八月采根，鲜者为生地，蒸晒为熟地。",
          "气味": "鲜、生地：甘，寒；熟地：甘，微温，无毒。",
          "主治": "生地清热凉血，养阴生津；熟地补血滋阴，益精填髓。治阴虚血少、腰膝酸软、月经不调。",
          "发明": "李时珍曰：地黄生则大寒凉血，熟则微温补血，一药两用，随炮制而异。脾虚湿滞、腹满便溏者不宜熟地。",
          "附方": "《小儿药证直诀》：熟地黄、山茱萸、山药、泽泻、牡丹皮、茯苓，研末蜜丸，补肾阴。六味地黄丸：滋阴补肾，治肾阴不足。"
        }
      },
      {
        "name": "麦门冬",
        "content": {
          "释名": "《本草纲目》：麦门冬一名沿阶草，生山谷肥地，四月采根，叶如韭，根连珠而白。",
          "气味": "甘，微寒，无毒。",
          "主治": "主心腹结气，伤中伤饱，胃络脉绝，羸瘦短气。养阴润肺，益胃生津，清心除烦。",
          "发明": "李时珍曰：麦门冬甘寒滋润，润肺清心，燥咳咽干者宜之。脾胃虚寒、湿痰壅盛者忌用。",
          "附方": "《经验方》：麦门冬、半夏、人参、甘草、大枣，水煎服，治肺胃阴虚咳逆。二冬汤：天冬、麦冬，水煎，润肺生津。"
        }
      },
      {
        "name": "五味子",
        "content": {
          "释名": "《本草纲目》：五味子一名玄及，生齐山山谷，七月采实，皮肉甘酸，核中辛苦，味兼五味。",
          "气味": "酸，温，无毒。",
          "主治": "主益气，咳逆上气，劳伤羸瘦，补不足，强阴，益男子精。收敛固涩，益气生津，补肾宁心。",
          "发明": "李时珍曰：五味子酸温收敛，入肺肾二经，敛肺滋肾，生津止汗。外有表邪、内有实热、咳嗽初起者不宜。",
          "附方": "《医学心悟》：五味子、麦冬、人参，水煎服，敛肺止汗生津。生脉散：人参、麦冬、五味子，益气敛汗，治气阴两虚。"
        }
      },
      {
        "name": "知母",
        "content": {

// ★ 当前页面所属部：复制到其他部时，只改这里的部名即可（和 books 里 name 一致）
const CURRENT_DEPT_NAME = "草部";

let currentDept = detectDept();
let currentMedicine = null;
let currentMedIdx = -1;
let fontSize = 16;
let isDark = localStorage.getItem('darkMode') === '1';

function toggleSidebar(){
  const s = document.getElementById('sidebar');
  const m = document.getElementById('mask');
  s.classList.toggle('open');
  m.classList.toggle('show');
}

// 三重识别：URL 参数 ?dept=gu.html → 文件名 → 页面标题里的部名 → CURRENT_DEPT_NAME 兜底
function detectDept(){
  const params = new URLSearchParams(location.search);
  const p = params.get('dept');

  let i = -1;
  if (p) i = books.findIndex(b => b.page === p || b.page === p + '.html' || b.name === p);

  if (i < 0) {
    const file = decodeURIComponent(location.pathname.split('/').pop() || '');
    i = books.findIndex(b => b.page === file);
  }

  if (i < 0) {
    const title = document.title || '';
    i = books.findIndex(b => title.includes(b.name));
  }

  if (i < 0) {
    i = books.findIndex(b => b.name === CURRENT_DEPT_NAME);
  }

  return i >= 0 ? i : 0;
}

function renderText(str){
  if(str==null) return "";
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function goPage(b){ location.href = b.page; }

// 左侧药材明细
function renderSidebar(){
  const list = document.getElementById('med-list');
  list.innerHTML = '';
  const dept = books[currentDept];

  if(!dept.medicines || dept.medicines.length === 0){
    list.innerHTML = '<div class="med-empty">暂无药材，可自行添加</div>';
    renderEmptyDept(dept);
    return;
  }

  dept.medicines.forEach((med, idx)=>{
    const el = document.createElement('div');
    el.className = 'med-item';
    el.textContent = med.name;
    el.onclick = ()=>{
      loadMedicine(idx);
      if(window.innerWidth <=768){ toggleSidebar(); }
    };
    list.appendChild(el);
  });
  loadMedicine(0);
}

// 空部门占位卡片
function renderEmptyDept(dept){
  document.getElementById('volume-info').innerHTML = '<strong>' + dept.name + '</strong>';
  document.getElementById('content-area').innerHTML =
    '<div class="card"><div class="card-header"><div class="card-title">' + dept.name +
    '</div><div class="card-sub">本部分类内容待补充</div></div></div>';
  document.querySelectorAll('.med-item').forEach(el => el.classList.remove('active'));
  document.getElementById('med-pager').classList.add('hidden');
  updateNav();
}

// 加载某一味药材
function loadMedicine(idx){
  const dept = books[currentDept];
  const med = dept.medicines[idx] || dept.medicines[0];
  if(!med){ renderEmptyDept(dept); return; }
  currentMedicine = med;
  currentMedIdx = dept.medicines.indexOf(med);

  document.getElementById('volume-info').innerHTML = '<strong>' + dept.name + ' · ' + med.name + '</strong>';

  const sections = Object.entries(med.content).map(([k,v])=>
    '<div class="section"><div class="section-title">'+k+'：</div>'+
    '<div class="section-text" contenteditable="true" spellcheck="false" data-key="'+k+'">'+renderText(v)+'</div></div>'
  ).join('');

  document.getElementById('content-area').innerHTML =
    '<div class="card"><div class="card-header"><div class="card-title">'+med.name+'</div>'+
    '<div class="card-sub">'+dept.name+'</div></div>'+sections+'</div>';

  document.querySelectorAll('.med-item').forEach((el,i)=> el.classList.toggle('active', i===idx));
  document.querySelectorAll('.section-text').forEach(el=>{
    el.onblur = function(){
      if(currentMedicine){ currentMedicine.content[this.dataset.key] = this.innerText; }
    };
  });
  updateNav();
  updateMedNav();
}

function updateNav(){
  const prev = document.getElementById('prev-btn');
  const next = document.getElementById('next-btn');
  prev.disabled = currentDept === 0;
  next.disabled = currentDept === books.length - 1;
  prev.textContent = currentDept>0 ? '❮ '+books[currentDept-1].name : '❮ 上一部';
  next.textContent = currentDept<books.length-1 ? books[currentDept+1].name+' ❯' : '下一部 ❯';
}

function prevDept(){ if(currentDept>0){ goPage(books[currentDept-1]); } }
function nextDept(){ if(currentDept<books.length-1){ goPage(books[currentDept+1]); } }

// 部内药材翻页（上一味 / 下一味）
function updateMedNav(){
  const dept = books[currentDept];
  const meds = dept.medicines || [];
  const pager = document.getElementById('med-pager');
  const prev = document.getElementById('prev-med-btn');
  const next = document.getElementById('next-med-btn');
  const pos = document.getElementById('med-pos');

  if(meds.length === 0){ pager.classList.add('hidden'); return; }
  pager.classList.remove('hidden');

  prev.disabled = currentMedIdx <= 0;
  next.disabled = currentMedIdx >= meds.length - 1;
  prev.textContent = currentMedIdx > 0 ? '❮ ' + meds[currentMedIdx-1].name : '❮ 上一味';
  next.textContent = currentMedIdx < meds.length - 1 ? meds[currentMedIdx+1].name + ' ❯' : '下一味 ❯';
  pos.textContent = (currentMedIdx + 1) + ' / ' + meds.length;
}

function prevMed(){
  const meds = books[currentDept].medicines || [];
  if(currentMedIdx > 0){ loadMedicine(currentMedIdx - 1); window.scrollTo({top:0, behavior:'smooth'}); }
}
function nextMed(){
  const meds = books[currentDept].medicines || [];
  if(currentMedIdx < meds.length - 1){ loadMedicine(currentMedIdx + 1); window.scrollTo({top:0, behavior:'smooth'}); }
}
function adjustFont(d){
  fontSize = Math.max(13,Math.min(24,fontSize+d));
  document.getElementById('content-area').style.fontSize = fontSize+'px';
}
function applyTheme(){
  document.body.classList.toggle('dark-mode', isDark);
  const tb = document.querySelector('.theme-toggle');
  if(tb) tb.textContent = isDark ? '☀' : '🌙';
}
function toggleTheme(){
  isDark = !isDark;
  localStorage.setItem('darkMode', isDark ? '1' : '0');
  applyTheme();
}

// 背景音乐：自动播放（先静音通过浏览器限制）；按钮切换播放/暂停
const bgMusic = document.getElementById('bgMusic');
const btnMusic = document.getElementById('btn-music');
function syncMusicIcon(){ btnMusic.textContent = bgMusic.paused ? '🎵' : '🔇'; }
bgMusic.play().then(syncMusicIcon).catch(syncMusicIcon);
function toggleMusic(){
  bgMusic.muted = false;
  if(bgMusic.paused){ bgMusic.play(); } else { bgMusic.pause(); }
  syncMusicIcon();
}
function unlockAudio(){
  bgMusic.muted = false; bgMusic.play(); syncMusicIcon();
  document.body.removeEventListener('click', unlockAudio);
  document.body.removeEventListener('pointerdown', unlockAudio);
  document.body.removeEventListener('touchstart', unlockAudio);
}
document.body.addEventListener('click', unlockAudio, { once: true });
document.body.addEventListener('pointerdown', unlockAudio, { once: true });
document.body.addEventListener('touchstart', unlockAudio, { once: true });

applyTheme();
document.getElementById('content-area').style.fontSize = fontSize+'px';
renderSidebar();
</script>
